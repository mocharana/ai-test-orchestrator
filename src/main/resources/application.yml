# ============================================================
# AI-Test-Orchestrator 平台基础配置
# ============================================================

server:
  # RuoYi 后端占 8080，平台用 8081 错开，两者可同时运行
  port: 8081

spring:
  application:
    name: ai-test-orchestrator

  # 私密配置导入：application-local.yml 在项目根、已被 .gitignore（只放密钥这类"不上库"的东西）
  # optional = 文件不存在也不报错（换机器没建此文件时服务仍能起，只是 AI 功能不可用）
  config:
    import: "optional:file:./application-local.yml"

  # ============================================================
  # AI 接入（M5）：Spring AI 走 OpenAI 兼容协议连智谱
  # 模型名 glm-4.5-flash = 智谱当前免费文本模型（老 glm-4-flash 已被 4.5 取代，官方文档已核实）
  # ============================================================
  ai:
    openai:
      # 智谱的 OpenAI 兼容端点（兼容 = 请求/响应格式与 OpenAI 一模一样，换个地址就能用）
      base-url: https://open.bigmodel.cn/api/paas/v4
      # Key 本体在 application-local.yml（不进 git），这里只留引用
      api-key: ${zhipu.api-key:}
      chat:
        options:
          model: glm-4.5-flash
          temperature: 0.7

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 库名锁定 ai_test_platform，SQL 只写表名
    url: jdbc:mysql://localhost:3306/ai_test_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

# url 参数说明：
#   useUnicode + characterEncoding：中文不乱码
#   serverTimezone=GMT+8：东八区（%2B 是 + 的转义）
#   useSSL=false：本地连接不加密
#   allowPublicKeyRetrieval=true：MySQL 8 的 caching_sha2 认证在服务重启后需要
#     索取 RSA 公钥，驱动默认禁止（防中间人）——本地打开无妨，公网应改用 SSL

# ============================================================
# JWT 配置
# ============================================================
jwt:
  # 签名密钥：HMAC-SHA256 要求 ≥32 字节；生产环境不入库（挪 application-local.yml/环境变量）
  secret: wen-aitest-platform-jwt-secret-key-2026-32bytes!
  # 门票有效期（小时）
  expire-hours: 24

# ============================================================
# 被测对象配置：执行引擎跑用例前先登录 RuoYi 拿 token
# 换被测系统 = 只改这段配置，代码不动
# ============================================================
ruoyi:
  base-url: http://localhost:8080
  username: admin
  password: admin123

# ============================================================
# UI 执行器配置（M4）：ProcessBuilder 用这个 python 跑阶段 3 的 pytest 用例
# ============================================================
pytest:
  # 阶段 3 venv 的 python 解释器（保证 selenium/pytest 依赖都在）
  python-path: C:\Users\rana\Desktop\Python\ruoyi_ui_framework\venv\Scripts\python.exe
  # pytest 项目根目录（conftest.py / pytest.ini 所在，作为子进程工作目录）
  work-dir: C:\Users\rana\Desktop\Python\ruoyi_ui_framework

# 安全提示：密码明文入库仅限学习项目；正规做法抽到 application-local.yml（已在 .gitignore）或环境变量
